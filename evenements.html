<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Événements & stages — Capoeira em Ação France</title>
<link rel="icon" href="assets/img/logo-badge.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="hero" style="padding:80px 0 100px;">
  <div class="wrap">
    <div class="eyebrow">Agenda</div>
    <h1>Événements <span class="accent">&amp; stages</span></h1>
    <p class="lead">Cours réguliers, stages, batizados et rencontres internationales.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div id="events-list" class="grid grid-2">
      <p style="color:var(--grey)">Chargement…</p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/components.js"></script>
<script>
  renderHeader("evenements.html");
  renderFooter();

  function eventTypeLabel(type) {
    return { cours: "Cours", stage: "Stage", batizado: "Batizado", rencontre_internationale: "Rencontre internationale" }[type] || type;
  }

  function toEmbedUrl(url) {
    const yt = url && url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]+)/);
    if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
    return url;
  }

  async function loadEvents() {
    const el = document.getElementById("events-list");
    const { data, error } = await supabaseClient
      .from("events").select("*, locations(name)")
      .order("event_date", { ascending: true });
    if (error || !data || data.length === 0) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📅</div>Aucun événement publié pour le moment. Revenez bientôt !</div>`;
      return;
    }
    el.innerHTML = data.map(ev => {
      const d = new Date(ev.event_date);
      const lieu = ev.locations ? ev.locations.name : (ev.location_other || "");
      const dateLabel = ev.end_date
        ? `${d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' })} → ${new Date(ev.end_date).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' })}`
        : d.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

      const links = [
        ev.instagram_url ? `<a href="${ev.instagram_url}" target="_blank" rel="noopener" class="btn btn-outline-dark" style="padding:6px 14px;font-size:.8rem;">Instagram</a>` : "",
        ev.facebook_url ? `<a href="${ev.facebook_url}" target="_blank" rel="noopener" class="btn btn-outline-dark" style="padding:6px 14px;font-size:.8rem;">Facebook</a>` : "",
      ].join(" ");

      return `
        <div class="card" style="padding:0;overflow:hidden;">
          ${ev.image_url ? `<img src="${ev.image_url}" alt="${ev.title}" style="width:100%;aspect-ratio:16/9;object-fit:cover;">` : ""}
          ${ev.video_url ? `<iframe src="${toEmbedUrl(ev.video_url)}" style="width:100%;aspect-ratio:16/9;border:none;" allowfullscreen loading="lazy"></iframe>` : ""}
          <div style="padding:24px;">
            <span class="badge-type" style="margin-left:0;">${eventTypeLabel(ev.event_type)}</span>
            <h3 style="font-family:var(--font-slant);font-weight:700;text-transform:uppercase;font-size:1.3rem;margin:10px 0 6px;">${ev.title}</h3>
            <div style="color:var(--red);font-weight:600;font-size:.9rem;">${dateLabel}</div>
            ${lieu ? `<div style="color:var(--grey);font-size:.9rem;margin-top:2px;">📍 ${lieu}</div>` : ""}
            ${ev.description ? `<p style="margin-top:10px;">${ev.description}</p>` : ""}
            ${links ? `<div style="margin-top:14px;">${links}</div>` : ""}
          </div>
        </div>`;
    }).join("");
  }
  loadEvents();
</script>
</body>
</html>
