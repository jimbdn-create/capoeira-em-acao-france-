<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Définir mon mot de passe — Capoeira em Ação France</title>
<link rel="icon" href="../assets/img/logo-badge.png">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background:var(--grey-light);">

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="background:var(--white);border:1px solid var(--grey-line);max-width:420px;width:100%;padding:44px 36px;">
    <div style="text-align:center;margin-bottom:26px;">
      <img src="../assets/img/logo-badge.png" alt="Logo" style="height:64px;width:64px;margin:0 auto 14px;">
      <h1 style="font-family:var(--font-display);text-transform:uppercase;font-size:1.3rem;margin:0;">Définir mon mot de passe</h1>
      <p style="color:var(--grey);font-size:.9rem;margin-top:6px;">Capoeira em Ação France — Espace admin</p>
    </div>
    <div id="error-msg" style="display:none;background:#fde8e8;color:var(--red-dark);padding:10px 14px;font-size:.88rem;margin-bottom:16px;"></div>
    <div id="success-msg" style="display:none;background:#e6f4ea;color:#1e7a34;padding:10px 14px;font-size:.88rem;margin-bottom:16px;"></div>

    <div id="loading-msg" style="text-align:center;color:var(--grey);padding:20px 0;">Vérification du lien…</div>

    <form id="set-password-form" style="display:none;">
      <div class="form-field">
        <label for="password">Nouveau mot de passe</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-field">
        <label for="password2">Confirmer le mot de passe</label>
        <input type="password" id="password2" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-red" style="width:100%;">Valider</button>
    </form>

    <div id="invalid-link" style="display:none;text-align:center;color:var(--grey);">
      <p>Ce lien n'est plus valide ou a déjà été utilisé.</p>
      <a href="login.html" class="btn btn-outline-dark" style="margin-top:10px;">Aller à la connexion</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
  // Le lien d'invitation/récupération place un token dans l'URL (#access_token=...)
  // supabase-js le détecte automatiquement et crée une session temporaire.
  supabaseClient.auth.getSession().then(({ data }) => {
    document.getElementById("loading-msg").style.display = "none";
    if (data.session) {
      document.getElementById("set-password-form").style.display = "block";
    } else {
      document.getElementById("invalid-link").style.display = "block";
    }
  });

  document.getElementById("set-password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw1 = document.getElementById("password").value;
    const pw2 = document.getElementById("password2").value;
    const errEl = document.getElementById("error-msg");
    const okEl = document.getElementById("success-msg");
    errEl.style.display = "none";
    okEl.style.display = "none";

    if (pw1 !== pw2) {
      errEl.textContent = "Les deux mots de passe ne correspondent pas.";
      errEl.style.display = "block";
      return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password: pw1 });
    if (error) {
      errEl.textContent = "Erreur : " + error.message;
      errEl.style.display = "block";
      return;
    }

    okEl.textContent = "Mot de passe défini ! Redirection…";
    okEl.style.display = "block";
    document.getElementById("set-password-form").style.display = "none";
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
  });
</script>
</body>
</html>
