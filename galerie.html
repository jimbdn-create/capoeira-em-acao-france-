<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie photos — Capoeira em Ação France</title>
<link rel="icon" href="assets/img/logo-badge.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="hero" style="padding:80px 0 100px;">
  <div class="wrap">
    <div class="eyebrow">Galerie</div>
    <h1>Photos <span class="accent">de nos rodas</span></h1>
    <p class="lead">Cours, stages et batizados, capturés au fil des sessions.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div id="photo-gallery" class="gallery-grid">
      <p style="color:var(--grey)">Chargement…</p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/components.js"></script>
<script>
  renderHeader("galerie.html");
  renderFooter();

  async function loadGallery() {
    const el = document.getElementById("photo-gallery");
    const { data, error } = await supabaseClient.from("gallery_photos").select("*").order("created_at", { ascending: false });
    if (error || !data || data.length === 0) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📷</div>Aucune photo publiée pour le moment.</div>`;
      return;
    }
    el.innerHTML = data.map(p => `
      <div class="gallery-item">
        <img src="${p.image_url}" alt="${p.title || ''}" loading="lazy">
        ${p.title ? `<div class="cap">${p.title}${p.category ? ` — ${p.category}` : ""}</div>` : ""}
      </div>
    `).join("");
  }
  loadGallery();
</script>
</body>
</html>
