<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cours en ligne — Capoeira em Ação France</title>
<link rel="icon" href="assets/img/logo-badge.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="hero" style="padding:80px 0 100px;">
  <div class="wrap">
    <div class="eyebrow">À distance</div>
    <h1>Cours <span class="accent">en ligne</span></h1>
    <p class="lead">Le travail de nos professeurs, en Île-de-France et à Aix-en-Provence, accessible où que vous soyez.</p>
    <div id="student-bar" style="margin-top:24px;"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <div id="courses-list" class="grid grid-3">
      <p style="color:var(--grey)">Chargement…</p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/components.js"></script>
<script>
  renderHeader("cours-en-ligne.html");
  renderFooter();

  function toEmbedUrl(url) {
    const yt = url && url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]+)/);
    if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
    return url;
  }

  async function renderStudentBar() {
    const { data } = await supabaseClient.auth.getSession();
    const bar = document.getElementById("student-bar");
    if (data.session) {
      bar.innerHTML = `
        <span style="color:#d8d5d2;font-size:.9rem;">Connecté(e) en tant qu'élève : ${data.session.user.email}</span>
        <button id="logout-student" class="btn btn-outline" style="margin-left:14px;padding:8px 18px;font-size:.85rem;">Se déconnecter</button>
      `;
      document.getElementById("logout-student").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.reload();
      });
    } else {
      bar.innerHTML = `
        <a href="eleves/login.html" class="btn btn-outline">Espace élève — Se connecter</a>
        <a href="eleves/inscription.html" class="btn btn-red" style="margin-left:14px;">Je suis élève, m'inscrire</a>
      `;
    }
  }

  async function loadCourses() {
    const el = document.getElementById("courses-list");
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const { data, error } = await supabaseClient.from("online_courses").select("*").order("created_at", { ascending: false });
    if (error || !data || data.length === 0) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🎓</div>Aucun cours en ligne publié pour le moment.</div>`;
      return;
    }
    el.innerHTML = data.map(c => `
      <div class="card" style="padding:0;overflow:hidden;">
        ${c.video_url ? `<iframe src="${toEmbedUrl(c.video_url)}" style="width:100%;aspect-ratio:16/9;border:none;" allowfullscreen loading="lazy"></iframe>` : ""}
        <div style="padding:22px;">
          <div style="margin-bottom:8px;">
            <span class="pill ${c.access_level === 'eleves' ? 'pill-stage' : 'pill-cours'}">${c.access_level === 'eleves' ? 'Réservé aux élèves' : 'Public'}</span>
          </div>
          <h3 style="margin:0 0 6px;">${c.title}</h3>
          ${c.teacher_name ? `<div style="color:var(--red);font-family:var(--font-slant);font-weight:700;text-transform:uppercase;font-size:.85rem;margin-bottom:8px;">${c.teacher_name}</div>` : ""}
          ${c.description ? `<p>${c.description}</p>` : ""}
        </div>
      </div>
    `).join("");

    // Enregistre un visionnage pour chaque cours affiché à un élève connecté (statistiques admin)
    if (sessionData.session) {
      const userId = sessionData.session.user.id;
      data.forEach(c => {
        supabaseClient.from("course_views").insert({ user_id: userId, course_id: c.id }).then(() => {});
      });
    }
  }

  renderStudentBar();
  loadCourses();
</script>
</body>
</html>
