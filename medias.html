<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Médias — Capoeira em Ação France</title>
<link rel="icon" href="assets/img/logo-badge.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .media-tabs { display:flex; gap:8px; margin-bottom:40px; flex-wrap:wrap; }
  .media-tab-btn {
    font-family: var(--font-slant); font-weight:700; text-transform:uppercase; font-size:.95rem;
    padding:12px 26px; border:2px solid var(--black); background:var(--white); color:var(--black);
    cursor:pointer; border-radius:var(--radius);
  }
  .media-tab-btn.active { background:var(--black); color:var(--white); }
  .media-panel { display:none; }
  .media-panel.active { display:block; }
  .song-card { background: var(--white); border: 1px solid var(--grey-line); margin-bottom: 24px; }
  .song-card summary {
    cursor: pointer; list-style: none; padding: 22px 28px; display:flex; align-items:center; justify-content:space-between;
    font-family: var(--font-slant); font-weight: 700; text-transform: uppercase; font-size: 1.15rem;
  }
  .song-card summary::-webkit-details-marker { display: none; }
  .song-card summary::after { content: "+"; font-family: var(--font-display); font-size: 1.4rem; color: var(--red); }
  .song-card[open] summary::after { content: "−"; }
  .song-body { padding: 0 28px 28px; }
  .lyrics-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 10px; }
  .lyrics-cols h4 { font-family: var(--font-slant); text-transform: uppercase; color: var(--red); font-size: .85rem; letter-spacing: 1px; margin-bottom: 10px; }
  .lyrics-cols pre { white-space: pre-wrap; font-family: var(--font-body); font-size: .95rem; line-height: 1.7; margin: 0; }
  @media (max-width: 700px) { .lyrics-cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="site-header"></div>

<section class="hero" style="padding:80px 0 100px;">
  <div class="wrap">
    <div class="eyebrow">Galerie & musicalité</div>
    <h1>Nos <span class="accent">médias</span></h1>
    <p class="lead">Photos, vidéos et chansons de Capoeira em Ação France.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="media-tabs" id="media-tabs">
      <button class="media-tab-btn active" data-tab="photos">Photos</button>
      <button class="media-tab-btn" data-tab="videos">Vidéos</button>
      <button class="media-tab-btn" data-tab="songs">Chansons</button>
    </div>

    <div class="media-panel active" id="panel-photos">
      <div id="photo-gallery" class="gallery-grid">
        <p style="color:var(--grey)">Chargement…</p>
      </div>
    </div>

    <div class="media-panel" id="panel-videos">
      <div id="video-gallery" class="grid grid-3">
        <p style="color:var(--grey)">Chargement…</p>
      </div>
    </div>

    <div class="media-panel" id="panel-songs" style="max-width:900px;">
      <div id="songs-list">
        <p style="color:var(--grey)">Chargement…</p>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/components.js"></script>
<script>
  renderHeader("medias.html");
  renderFooter();

  // --- Onglets ---
  document.querySelectorAll(".media-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".media-tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".media-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      history.replaceState(null, "", "#" + btn.dataset.tab);
    });
  });
  // Ouvre directement le bon onglet si un lien pointe vers #videos ou #songs
  const initialTab = window.location.hash.replace("#", "");
  if (["photos", "videos", "songs"].includes(initialTab)) {
    document.querySelector(`.media-tab-btn[data-tab="${initialTab}"]`).click();
  }

  // --- Galerie photos ---
  async function loadGallery() {
    const el = document.getElementById("photo-gallery");
    const { data, error } = await supabaseClient.from("gallery_photos").select("*").order("created_at", { ascending: false });
    if (error || !data || data.length === 0) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📷</div>Aucune photo publiée pour le moment.</div>`;
      return;
    }
    el.innerHTML = data.map(p => `
      <div class="gallery-item">
        ${p.image_url.toLowerCase().endsWith('.pdf')
          ? `<a href="${p.image_url}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;height:100%;background:var(--black);color:var(--white);font-family:var(--font-slant);text-transform:uppercase;">📄 Voir le PDF</a>`
          : `<img src="${p.image_url}" alt="${p.title || ''}" loading="lazy">`}
        ${p.title ? `<div class="cap">${p.title}${p.category ? ` — ${p.category}` : ""}</div>` : ""}
      </div>
    `).join("");
  }

  // --- Galerie vidéos ---
  function toEmbedUrl(url) {
    const yt = url && url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]+)/);
    if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
    return url;
  }
  async function loadVideos() {
    const el = document.getElementById("video-gallery");
    const { data, error } = await supabaseClient.from("gallery_videos").select("*").order("created_at", { ascending: false });
    if (error || !data || data.length === 0) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🎬</div>Aucune vidéo publiée pour le moment.</div>`;
      return;
    }
    el.innerHTML = data.map(v => `
      <div class="card video-card" style="padding:0;overflow:hidden;">
        <iframe src="${toEmbedUrl(v.video_url)}" allowfullscreen loading="lazy"></iframe>
        <div style="padding:16px;">
          ${v.title ? `<h3 style="margin:0 0 6px;">${v.title}</h3>` : ""}
          ${v.description ? `<p>${v.description}</p>` : ""}
        </div>
        ${v.thumbnail_url ? `<img src="${v.thumbnail_url}" alt="${v.title || ''}" style="width:100%;display:block;">` : ""}
      </div>
    `).join("");
  }

  // --- Chansons ---
  function toSongMedia(url) {
    const yt = url && url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]+)/);
    if (yt) return { type: "youtube", url: `https://www.youtube.com/embed/${yt[1]}` };
    if (url && url.includes("instagram.com")) return { type: "instagram", url };
    return url ? { type: "link", url } : null;
  }
  async function loadSongs() {
    const el = document.getElementById("songs-list");
    const { data, error } = await supabaseClient.from("songs").select("*").order("title");
    if (error || !data || data.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🎵</div>Aucune chanson publiée pour le moment.</div>`;
      return;
    }
    el.innerHTML = data.map(s => {
      const media = toSongMedia(s.media_url);
      let mediaHtml = "";
      if (media?.type === "youtube") {
        mediaHtml = `<iframe src="${media.url}" style="width:100%;aspect-ratio:16/9;border:none;margin-top:18px;" allowfullscreen loading="lazy"></iframe>`;
      } else if (media) {
        mediaHtml = `<a href="${media.url}" target="_blank" rel="noopener" class="btn btn-outline-dark" style="margin-top:18px;">Écouter / voir sur ${media.type === "instagram" ? "Instagram" : "le lien"}</a>`;
      }
      return `
        <details class="song-card">
          <summary>${s.title}</summary>
          <div class="song-body">
            <div class="lyrics-cols">
              <div><h4>Paroles</h4><pre>${s.lyrics_original || "—"}</pre></div>
              <div><h4>Traduction française</h4><pre>${s.lyrics_translation || "—"}</pre></div>
            </div>
            ${mediaHtml}
          </div>
        </details>`;
    }).join("");
  }

  loadGallery();
  loadVideos();
  loadSongs();
  applyTranslations();
</script>
</body>
</html>
