<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace élève — Capoeira em Ação France</title>
<link rel="icon" href="../assets/img/logo-badge.png">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background:var(--grey-light);">

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="background:var(--white);border:1px solid var(--grey-line);max-width:420px;width:100%;padding:44px 36px;">
    <div style="text-align:center;margin-bottom:26px;">
      <img src="../assets/img/logo-badge.png" alt="Logo" style="height:64px;width:64px;margin:0 auto 14px;">
      <h1 style="font-family:var(--font-display);text-transform:uppercase;font-size:1.4rem;margin:0;">Espace élève</h1>
      <p style="color:var(--grey);font-size:.9rem;margin-top:6px;">Cours en ligne — Capoeira em Ação France</p>
    </div>
    <div id="error-msg" style="display:none;background:#fde8e8;color:var(--red-dark);padding:10px 14px;font-size:.88rem;margin-bottom:16px;"></div>
    <form id="login-form">
      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-red" style="width:100%;">Se connecter</button>
    </form>
    <div style="text-align:center;margin-top:22px;">
      <a href="../cours-en-ligne.html" style="color:var(--grey);font-size:.85rem;">&larr; Retour au site</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errEl = document.getElementById("error-msg");
    errEl.style.display = "none";

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = "Identifiants incorrects.";
      errEl.style.display = "block";
      return;
    }
    window.location.href = "../cours-en-ligne.html";
  });

  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "../cours-en-ligne.html";
  });
</script>
</body>
</html>
