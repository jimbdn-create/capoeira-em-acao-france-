<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidéos — Capoeira em Ação France</title>
<link rel="icon" href="assets/img/logo-badge.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="hero" style="padding:80px 0 100px;">
  <div class="wrap">
    <div class="eyebrow" data-i18n="page_videos_eyebrow">Galerie</div>
    <h1><span data-i18n="page_videos_title1">Vidéos</span> <span class="accent" data-i18n="page_videos_title_accent">& roda live</span></h1>
    <p class="lead" data-i18n="page_videos_lead">Extraits de rodas, démonstrations et moments de stages.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div id="video-gallery" class="grid grid-3">
      <p style="color:var(--grey)">Chargement…</p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/components.js"></script>
<script>
  renderHeader("videos.html");
  renderFooter();

  function toEmbedUrl(url) {
    // Convertit un lien YouTube standard en lien embed
    const yt = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]+)/);
    if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
    return url;
  }

  async function loadVideos() {
    const el = document.getElementById("video-gallery");
    const { data, error } = await supabaseClient.from("gallery_videos").select("*").order("created_at", { ascending: false });
    if (error || !data || data.length === 0) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🎬</div>${(translations[getCurrentLang()]||translations.fr).empty_videos}</div>`;
      return;
    }
    el.innerHTML = data.map(v => `
      <div class="card video-card" style="padding:0;overflow:hidden;">
        <iframe src="${toEmbedUrl(v.video_url)}" allowfullscreen loading="lazy"></iframe>
        <div style="padding:16px;">
          ${v.title ? `<h3 style="margin:0 0 6px;">${v.title}</h3>` : ""}
          ${v.description ? `<p>${v.description}</p>` : ""}
        </div>
        ${v.thumbnail_url ? `<img src="${v.thumbnail_url}" alt="${v.title || ''}" style="width:100%;display:block;">` : ""}
      </div>
    `).join("");
  }
  loadVideos();
  applyTranslations();
</script>
</body>
</html>
