<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chansons de Capoeira — Capoeira em Ação France</title>
<link rel="icon" href="assets/img/logo-badge.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .song-card { background: var(--white); border: 1px solid var(--grey-line); margin-bottom: 24px; }
  .song-card summary {
    cursor: pointer; list-style: none; padding: 22px 28px; display:flex; align-items:center; justify-content:space-between;
    font-family: var(--font-slant); font-weight: 700; text-transform: uppercase; font-size: 1.15rem;
  }
  .song-card summary::-webkit-details-marker { display: none; }
  .song-card summary::after { content: "+"; font-family: var(--font-display); font-size: 1.4rem; color: var(--red); }
  .song-card[open] summary::after { content: "−"; }
  .song-body { padding: 0 28px 28px; }
  .lyrics-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 10px; }
  .lyrics-cols h4 { font-family: var(--font-slant); text-transform: uppercase; color: var(--red); font-size: .85rem; letter-spacing: 1px; margin-bottom: 10px; }
  .lyrics-cols pre { white-space: pre-wrap; font-family: var(--font-body); font-size: .95rem; line-height: 1.7; margin: 0; }
  @media (max-width: 700px) { .lyrics-cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="site-header"></div>

<section class="hero" style="padding:80px 0 100px;">
  <div class="wrap">
    <div class="eyebrow">Musicalité</div>
    <h1>Chansons <span class="accent">de Capoeira</span></h1>
    <p class="lead">Paroles, traduction en français, et un lien pour apprendre à les chanter.</p>
  </div>
</section>

<section>
  <div class="wrap" style="max-width:900px;">
    <div id="songs-list">
      <p style="color:var(--grey)">Chargement…</p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/components.js"></script>
<script>
  renderHeader("chansons.html");
  renderFooter();

  function toEmbedUrl(url) {
    const yt = url && url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=)([\w-]+)/);
    if (yt) return { type: "youtube", url: `https://www.youtube.com/embed/${yt[1]}` };
    if (url && url.includes("instagram.com")) return { type: "instagram", url };
    return url ? { type: "link", url } : null;
  }

  async function loadSongs() {
    const el = document.getElementById("songs-list");
    const { data, error } = await supabaseClient.from("songs").select("*").order("title");
    if (error || !data || data.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🎵</div>Aucune chanson publiée pour le moment.</div>`;
      return;
    }
    el.innerHTML = data.map(s => {
      const media = toEmbedUrl(s.media_url);
      let mediaHtml = "";
      if (media?.type === "youtube") {
        mediaHtml = `<iframe src="${media.url}" style="width:100%;aspect-ratio:16/9;border:none;margin-top:18px;" allowfullscreen loading="lazy"></iframe>`;
      } else if (media) {
        mediaHtml = `<a href="${media.url}" target="_blank" rel="noopener" class="btn btn-outline-dark" style="margin-top:18px;">Écouter / voir sur ${media.type === "instagram" ? "Instagram" : "le lien"}</a>`;
      }
      return `
        <details class="song-card">
          <summary>${s.title}</summary>
          <div class="song-body">
            <div class="lyrics-cols">
              <div>
                <h4>Paroles</h4>
                <pre>${s.lyrics_original || "—"}</pre>
              </div>
              <div>
                <h4>Traduction française</h4>
                <pre>${s.lyrics_translation || "—"}</pre>
              </div>
            </div>
            ${mediaHtml}
          </div>
        </details>`;
    }).join("");
  }
  loadSongs();
</script>
</body>
</html>
